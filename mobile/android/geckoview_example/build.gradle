plugins {
    alias(libs.plugins.kotlin.android)
}

apply plugin: 'com.android.application'

android {
    buildToolsVersion = project.ext.buildToolsVersion
    compileSdkVersion = project.ext.compileSdkVersion

    defaultConfig {
        targetSdkVersion = project.ext.targetSdkVersion
        minSdkVersion = project.ext.minSdkVersion
        manifestPlaceholders = project.ext.manifestPlaceholders

        // GPULEAK soak: reuse a package name the Connect3 device owner already
        // whitelists for lock task, so the repro app can launch on the kiosk.
        // Overridable so a diagnostic build (e.g. DMD) can install alongside a
        // live soak app instead of replacing it and losing its leak state;
        // icg.virtualcycling.management is the other free whitelisted id.
        applicationId System.getenv("GVE_APPLICATION_ID") ?: "com.icg.connect.dualdisplaydemo"
        versionCode project.ext.versionCode
        versionName project.ext.versionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // By default the android plugins ignores folders that start with `_`, but
    // we need those in web extensions.
    // See also:
    //  - https://issuetracker.google.com/issues/36911326
    //  - https://stackoverflow.com/questions/9206117/how-to-workaround-autoomitting-fiiles-folders-starting-with-underscore-in
    aaptOptions {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress 'ja'
    }

    buildFeatures {
        buildConfig = true
    }

    namespace = 'org.mozilla.geckoview_example'
}

dependencies {
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.androidx.preferences

    implementation project(path: ':geckoview')
    implementation libs.androidx.constraintlayout
    implementation libs.google.material
}
